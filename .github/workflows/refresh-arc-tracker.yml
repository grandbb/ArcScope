name: Refresh AScope ARC tracker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ascope-arc-tracker-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read the current ArcScan snapshot
        run: node scripts/update-arc-snapshot.cjs
      - name: Publish changed on-chain data
        shell: bash
        run: |
          if git diff --quiet -- public/ascope-arc-snapshot.json; then
            echo "ARC holders and transfers are already current."
            exit 0
          fi
          git config user.name "ascope-data-bot"
          git config user.email "ascope-data-bot@users.noreply.github.com"
          git add public/ascope-arc-snapshot.json
          git commit -m "Update hourly ARC tracker snapshot"
          git push origin HEAD:main
