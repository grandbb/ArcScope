name: Refresh AScope ARC tracker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ascope-arc-tracker-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify current finalized Arc Mainnet data
        run: node scripts/update-arc-snapshot.cjs
      - name: Publish hourly verified checkpoint
        shell: bash
        run: |
          git config user.name "grandbb"
          git config user.email "118791134+grandbb@users.noreply.github.com"
          git add public/ascope-arc-snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "Update hourly ARC tracker checkpoint"
          git push origin HEAD:main
